<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f1ebe1">
  <title>Morning Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>

  <section id="d-lock" class="lock" hidden>
    <div class="lock-card">
      <h1 class="brand">Morning Desk</h1>
      <p class="sub" id="d-lock-sub">Enter your PIN to begin.</p>
      <input id="d-pin" class="pin" type="password" inputmode="numeric" placeholder="PIN" autocomplete="off">
      <button id="d-unlock" class="btn primary">Open</button>
      <p id="d-lock-error" class="error" hidden>That PIN didn't work.</p>
    </div>
  </section>

  <main id="d-app" hidden>
    <header class="d-top">
      <div class="d-left">
        <div id="d-date" class="d-date"></div>
        <div class="wx-line"><span id="d-weather" class="weather"></span></div>
        <div id="d-place" class="place"></div>
        <div id="d-bars" class="wbars" hidden></div>
      </div>
      <div class="d-right">
        <div id="d-profiles" class="d-profiles"></div>
      </div>
    </header>

    <section class="d-stage">
      <div class="d-look-head">
        <span class="d-eyebrow">Today's look</span>
        <span id="d-headline" class="d-headline"></span>
      </div>
      <div id="d-look" class="look"></div>
      <p class="d-hint">tap a piece to swap or remove it</p>

      <div class="d-controls">
        <input id="d-wish" class="d-wish" type="text" placeholder="Anything for today? e.g. “warmer”, “wear the navy sweater”">
        <button id="d-regen" class="btn primary d-regen">↻ New outfit</button>
      </div>

      <button id="d-adv-toggle" class="d-adv-toggle">Advanced ⌄</button>
      <div id="d-advanced" class="d-advanced" hidden>
        <div id="d-occasions" class="row"></div>
        <div class="row controls"><div class="stepper"><span>Warmth</span>
          <button data-warm="-1">＋ Warmer</button><button data-warm="1">Lighter ＋</button></div></div>
        <div class="row controls"><div class="stepper"><span>Polish</span>
          <button data-dress="1">↑ Dressier</button><button data-dress="-1">↓ Casual</button></div></div>
      </div>
    </section>
  </main>

  <!-- Piece action popover -->
  <div id="d-pop" class="d-pop" hidden></div>
  <!-- Zoom -->
  <div id="d-zoom" class="zoom" hidden><img id="d-zoom-img" alt=""></div>

  <div id="d-loading" class="loading" hidden><div class="spinner"></div></div>
  <script src="/static/dashboard.js"></script>
</body>
</html>
