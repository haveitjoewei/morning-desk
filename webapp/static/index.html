<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f1ebe1">
  <title>Closet</title>
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <section id="lock" class="lock">
    <div class="lock-card">
      <h1 class="brand">Your Closet</h1>
      <p class="sub">A little outfit, picked for today.</p>
      <input id="pin" class="pin" type="password" inputmode="numeric" placeholder="Enter PIN" autocomplete="off">
      <button id="unlock" class="btn primary">Open</button>
      <p id="lock-error" class="error" hidden>That PIN didn't work.</p>
    </div>
  </section>

  <main id="app" hidden>
    <header class="top">
      <div>
        <div id="date-label" class="date"></div>
        <div id="weather" class="weather"></div>
      </div>
      <button id="settings-btn" class="icon-btn" aria-label="Settings">⚙</button>
    </header>

    <section class="outfit">
      <h2 id="headline" class="headline"></h2>
      <div id="look" class="look"></div>
      <p class="hint" id="look-hint" hidden>Tap a piece to swap it.</p>
      <p id="reason" class="reason"></p>
    </section>

    <section class="tweaks">
      <div class="row" id="occasions"></div>

      <div class="row controls">
        <div class="stepper"><span>Warmth</span>
          <button data-warm="-1">＋ Warmer</button><button data-warm="1">Lighter ＋</button></div>
      </div>
      <div class="row controls">
        <div class="stepper"><span>Polish</span>
          <button data-dress="1">↑ Dressier</button><button data-dress="-1">↓ Casual</button></div>
      </div>

      <div class="row">
        <button id="anchor-btn" class="chip">★ Anchor a piece</button>
        <button id="variety-btn" class="chip">🔀 Surprise me</button>
        <button id="plan-btn" class="chip">📅 Plan ahead</button>
      </div>
      <div class="row plan" id="plan" hidden>
        <input type="date" id="date">
        <input type="text" id="city" placeholder="City (optional)">
        <button id="plan-apply" class="chip">Apply</button>
      </div>

      <div class="row wish-row">
        <input id="wish" class="wish" type="text" placeholder="Anything else? e.g. “something flowy”, “wear the green cardigan”">
      </div>
      <button id="regen" class="btn primary wide">Show me an outfit</button>
    </section>
  </main>

  <!-- Anchor picker (grouped by category) -->
  <div id="picker" class="modal" hidden>
    <div class="modal-card">
      <div class="modal-head"><span>Build around…</span><button id="picker-close" class="icon-btn">✕</button></div>
      <p class="modal-note">Pick one or more pieces. If two pieces clash, the stylist keeps the stronger anchor.</p>
      <div id="picker-groups"></div>
      <button id="picker-apply" class="btn primary wide">Build outfit</button>
    </div>
  </div>

  <!-- Reject reason -->
  <div id="reason-modal" class="modal" hidden>
    <div class="modal-card">
      <div class="modal-head"><span id="reason-title">Swap this piece</span><button id="reason-close" class="icon-btn">✕</button></div>
      <div class="row" id="reason-chips"></div>
      <button id="edit-piece" class="chip">Edit warmth / polish / comfort</button>
    </div>
  </div>

  <!-- Piece metadata -->
  <div id="piece-editor" class="modal" hidden>
    <div class="modal-card">
      <div class="modal-head"><span id="piece-title">Edit piece</span><button id="piece-close" class="icon-btn">✕</button></div>
      <label class="range"><span>Warmth <b id="warmth-value"></b></span><input id="piece-warmth" type="range" min="1" max="5"></label>
      <label class="range"><span>Polish <b id="polish-value"></b></span><input id="piece-polish" type="range" min="1" max="5"></label>
      <label class="range"><span>Comfort <b id="comfort-value"></b></span><input id="piece-comfort" type="range" min="1" max="5"></label>
      <label class="range"><span>Wear often <b id="wear-value"></b></span><input id="piece-wear" type="range" min="1" max="5"></label>
      <label class="toggle"><input type="checkbox" id="piece-home"> Good for home</label>
      <label class="toggle"><input type="checkbox" id="piece-office"> Good for office</label>
      <label class="toggle"><input type="checkbox" id="piece-avoid"> Avoid recommending often</label>
      <button id="piece-save" class="btn primary wide">Save ratings</button>
    </div>
  </div>

  <!-- Settings -->
  <div id="settings" class="modal" hidden>
    <div class="modal-card">
      <div class="modal-head"><span>Preferences</span><button id="settings-close" class="icon-btn">✕</button></div>
      <label class="toggle"><input type="checkbox" id="runs-cold"> I run cold (prefer warmer layers)</label>
      <label class="field"><span>Your style, in your words</span>
        <textarea id="style-notes" rows="3" placeholder="soft neutrals, cozy and put-together…"></textarea></label>
      <label class="field"><span>Colours you love (comma separated)</span>
        <input type="text" id="love-colors" placeholder="sage, cream, camel"></label>
      <label class="field"><span>Colours to avoid</span>
        <input type="text" id="avoid-colors" placeholder="neon"></label>
      <label class="field"><span>Office days (you dress sharper)</span>
        <span class="weekdays" id="office-days"></span></label>
      <button id="settings-save" class="btn primary wide">Save</button>
    </div>
  </div>

  <div id="loading" class="loading" hidden><div class="spinner"></div></div>
  <script src="/static/app.js"></script>
</body>
</html>
